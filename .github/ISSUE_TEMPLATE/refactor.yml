name: "♻️ Refactor"
description: Code restructuring without behavior change
title: "[Refactor]: "
labels: ["refactor"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is being restructured, and why? What has to behave exactly as before?
      placeholder: E.g. Extract the damage arithmetic from Combat.cs into an engine-free class that can be unit-tested...
    validations:
      required: true

  - type: textarea
    id: subtasks
    attributes:
      label: Sub-tasks checklist
      description: Break the work down into concrete steps (optional, can be completed or adjusted later)
      placeholder: |
        - [ ] Extract the logic into a plain C# class
        - [ ] Cover it with unit tests, each with a negative control
        - [ ] Confirm the behavior is unchanged in a headless run
      value: |
        - [ ] 
    validations:
      required: false

  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      description: Which stage of the roadmap does this task belong to?
      # The open milestones, under their exact GitHub titles. The same list is in
      # every form in this folder: add a milestone to all of them when it is
      # created, and drop it from all of them when it closes.
      options:
        - M6 - Dialogue, Decisions and Localization
        - M7 - Characters and Stats
        - M8 - Combat v2
        - M9 - Saving
        - M10 - Maps and Exploration
        - M11 - The First Real Cycle
        - Not defined yet
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Any relevant consideration, reference, or technical question
    validations:
      required: false
