name: "✨ Feature / Task"
description: New functionality, system, or task to implement
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be implemented? Why is it needed?
      placeholder: E.g. Implement the basic turn-based combat system...
    validations:
      required: true

  - type: textarea
    id: subtasks
    attributes:
      label: Sub-tasks checklist
      description: Break the work down into concrete steps (optional, can be completed or adjusted later)
      placeholder: |
        - [ ] Define turn data structure
        - [ ] Implement turn order
        - [ ] Connect to minimal UI
      value: |
        - [ ] 
    validations:
      required: false

  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      description: Which stage of the roadmap does this task belong to?
      # The open milestones, under their exact GitHub titles. The same list is in
      # every form in this folder: add a milestone to all of them when it is
      # created, and drop it from all of them when it closes.
      options:
        - M7 - Characters and Stats
        - M8 - Combat v2
        - M9 - Saving
        - M10 - Maps and Exploration
        - M11 - The First Real Cycle
        - Not defined yet
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Any relevant consideration, reference, or technical question
    validations:
      required: false
