name: "🧹 Chore"
description: Maintenance with no gameplay change — CI, dependencies, configuration, releases
title: "[Chore]: "
labels: ["chore"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs maintaining, and why now?
      placeholder: E.g. Bump the CI actions to versions that run on Node 24, since the current ones run on a deprecated Node...
    validations:
      required: true

  - type: textarea
    id: subtasks
    attributes:
      label: Sub-tasks checklist
      description: Break the work down into concrete steps (optional, can be completed or adjusted later)
      placeholder: |
        - [ ] Bump actions/checkout and actions/setup-dotnet
        - [ ] Confirm the build check passes on the PR
        - [ ] Update CHANGELOG.md
      value: |
        - [ ] 
    validations:
      required: false

  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      description: Which stage of the roadmap does this task belong to?
      # The open milestones, under their exact GitHub titles. The same list is in
      # every form in this folder: add a milestone to all of them when it is
      # created, and drop it from all of them when it closes.
      options:
        - M6 - Dialogue, Decisions and Localization
        - M7 - Characters and Stats
        - M8 - Combat v2
        - M9 - Saving
        - M10 - Maps and Exploration
        - M11 - The First Real Cycle
        - Not defined yet
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Any relevant consideration, reference, or technical question
    validations:
      required: false
