name: "🐛 Bug"
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the problem
      placeholder: E.g. The player clips through walls at certain corners of the map...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Correct/expected behavior
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Detail how to reliably trigger the bug
      placeholder: |
        1. Enter map X
        2. Move towards corner Y
        3. Observe that...
    validations:
      required: false

  - type: dropdown
    id: milestone
    attributes:
      label: Related milestone
      # The open milestones, under their exact GitHub titles. The same list is in
      # every form in this folder: add a milestone to all of them when it is
      # created, and drop it from all of them when it closes.
      options:
        - M6 - Dialogue, Decisions and Localization
        - M7 - Characters and Stats
        - M8 - Combat v2
        - M9 - Saving
        - M10 - Maps and Exploration
        - M11 - The First Real Cycle
        - Not defined yet
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Screenshots, error logs, or any extra context
    validations:
      required: false
