name: "🐛 Bug"
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the problem
      placeholder: E.g. The player clips through walls at certain corners of the map...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Correct/expected behavior
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Detail how to reliably trigger the bug
      placeholder: |
        1. Enter map X
        2. Move towards corner Y
        3. Observe that...
    validations:
      required: false

  - type: dropdown
    id: milestone
    attributes:
      label: Related milestone
      options:
        - M0 - Setup
        - M1 - Core architecture
        - M2 - First playable map
        - M3 - Minimal combat
        - M4 - Exploration-combat integration
        - Not defined yet
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Screenshots, error logs, or any extra context
    validations:
      required: false
