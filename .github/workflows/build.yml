name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Game

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The solution covers both the game and tests/Game.Tests, so every step
      # below reaches the test project without a working-directory of its own.
      - name: Restore dependencies
        run: dotnet restore "Godot RPG Project.sln"

      - name: Build
        run: dotnet build "Godot RPG Project.sln" --no-restore --configuration Debug

      - name: Test
        run: dotnet test "Godot RPG Project.sln" --no-restore --configuration Debug --verbosity normal

      # Last on purpose: a formatting nit should not stop the build and test
      # results from being reported, since GitHub Actions halts at the first
      # failing step.
      - name: Verify formatting
        run: dotnet format "Godot RPG Project.sln" --verify-no-changes --no-restore
